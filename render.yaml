services:
  # 1. API & Web UI Service
  - type: web
    name: distributed-workflow-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    envVars:
      - key: PORT
        value: 4000
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCESS_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: workflow-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://red-dbj46c67bikc73ecdi0g:6379

  # 2. BullMQ Distributed Engine Worker (with FFmpeg)
  - type: worker
    name: distributed-workflow-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: "node dist/worker.js"
    plan: standard
    region: oregon
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: workflow-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://red-dbj46c67bikc73ecdi0g:6379

databases:
  - name: workflow-postgres
    plan: free
    region: oregon
